apiVersion: v1
kind: Namespace
metadata: {name: vk-probe, labels: {role: client}}
---
apiVersion: v1
kind: Namespace
metadata: {name: vk-outside}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: {name: retain}
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: Pod
metadata: {name: prober, namespace: vk-probe}
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: p
    image: postgres:17-alpine
    command: ["sleep", "infinity"]
---
apiVersion: v1
kind: Pod
metadata: {name: prober, namespace: vk-outside}
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: p
    image: postgres:17-alpine
    command: ["sleep", "infinity"]
