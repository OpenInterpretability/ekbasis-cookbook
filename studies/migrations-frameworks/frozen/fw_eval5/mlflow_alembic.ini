[alembic]
script_location = mlflow.store:db_migrations
sqlalchemy.url = postgresql://ekeval_role:ekeval_pw@ekeval-pg:5432/prog_mlflow

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(message)s
